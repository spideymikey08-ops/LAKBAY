  <title>Lakbay | Baguio City Travel Explorer &amp; Itinerary Planner</title>
  <!-- Apply the saved appearance before stylesheets load to avoid a flash -->
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('lakbay_appearance');
        if (!theme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'night';
        }
        if (theme === 'night') document.documentElement.setAttribute('data-theme', 'night');
      } catch (e) { /* storage unavailable */ }
    })();
  </script>
