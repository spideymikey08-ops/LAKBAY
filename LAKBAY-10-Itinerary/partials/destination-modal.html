  <!-- ==================== SCREEN 3: DESTINATION DETAILS MODAL ==================== -->
  <div class="modal-overlay" id="destination-modal" role="dialog" aria-modal="true" aria-hidden="true" style="display: none;">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <div class="modal-dialog" id="destination-modal-dialog">
      <div class="modal-content">
        <!-- Close Button -->
        <button type="button" class="modal-close-btn" id="modal-close-btn" aria-label="Close modal">&times;</button>
        
        <!-- Modal Top Image Banner -->
        <div class="modal-image-wrap">
          <img id="modal-img" src="assets/images/burnham-park.jpg" alt="Destination photo" class="modal-image">
          <div class="modal-badge-row">
            <span class="badge" id="modal-category">Category</span>
            <span class="badge fee-badge" id="modal-fee">Fee: &#8369;0</span>
            <span class="badge rating-badge" id="modal-rating-badge">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="#f59e0b" stroke="#f59e0b"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              <span id="modal-rating-text">4.8</span>
            </span>
          </div>
        </div>

        <!-- Modal Body Content (Scrollable) -->
        <div class="modal-body" id="modal-scrollable-body">
          <h2 class="modal-title" id="modal-title">Destination Name</h2>
          <p class="modal-location" id="modal-location">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span id="modal-location-text">Location</span>
          </p>

          <div class="modal-info-grid">
            <div class="modal-info-card">
              <span class="modal-info-label">&#128205; Area Cluster</span>
              <strong class="modal-info-val" id="modal-area">Downtown / Burnham</strong>
            </div>
            <div class="modal-info-card">
              <span class="modal-info-label">&#128338; Operating Hours</span>
              <strong class="modal-info-val" id="modal-hours">Open 24 hours daily</strong>
            </div>
          </div>

          <div class="modal-section">
            <h4 class="modal-section-heading">About</h4>
            <p class="modal-description" id="modal-description">Description text...</p>
          </div>

          <div class="modal-section">
            <h4 class="modal-section-heading">Activities</h4>
            <div class="modal-activities-tags" id="modal-activities">
              <!-- Dynamically populated -->
            </div>
          </div>

          <div class="modal-section">
            <h4 class="modal-section-heading">&#127749; Best Time to Visit</h4>
            <p class="modal-detail-text" id="modal-best-time">Morning hours</p>
          </div>

          <div class="modal-section">
            <h4 class="modal-section-heading">&#128652; How to Get There</h4>
            <p class="modal-detail-text" id="modal-how-to-get-there">Directions</p>
          </div>

          <div class="modal-section modal-tip-box">
            <h4 class="modal-section-heading">&#128161; Local Baguio Tip</h4>
            <p class="modal-detail-text" id="modal-tip">Tip</p>
          </div>

          <div class="modal-section modal-map-link-section">
            <a href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline btn-sm btn-gmaps" id="modal-gmaps-link">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
              <span>Open in Google Maps &rarr;</span>
            </a>
          </div>
        </div>

        <!-- Modal Actions (Pinned to Bottom) -->
        <div class="modal-footer" id="modal-pinned-footer">
          <button type="button" class="btn btn-primary" id="modal-itinerary-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span id="modal-itinerary-btn-text">Add to itinerary</span>
          </button>
        </div>
      </div>
    </div>
  </div>
