    <!-- ==================== ADD / EDIT ITINERARY STOP MODAL (RIGHT SIDE DRAWER) ==================== -->
  <div class="modal-overlay modal-side" id="stop-editor-modal" role="dialog" aria-modal="true" aria-hidden="true" style="display: none;">
    <div class="modal-backdrop" id="stop-editor-backdrop"></div>
    <div class="modal-dialog modal-dialog-drawer">
      <div class="modal-content">

        <!-- Pinned drawer header -->
        <div class="modal-header drawer-header">
          <div class="drawer-heading">
            <span class="drawer-kicker">Trip Planner</span>
            <h3 class="modal-title" id="stop-modal-title">Add Place to Itinerary</h3>
          </div>
          <button type="button" class="modal-close-btn drawer-close-btn" id="stop-modal-close" aria-label="Close dialog">&times;</button>
        </div>

        <form id="stop-editor-form" class="drawer-form" novalidate onsubmit="return false;">
          <input type="hidden" id="stop-edit-id" value="">
          <!-- Hidden picker keeps the existing destination lookup intact -->
          <select id="stop-destination-select" class="form-select" style="display: none;" tabindex="-1" aria-hidden="true"></select>

          <!-- Scrollable, evenly-spaced form body -->
          <div class="drawer-form-body">

            <div class="drawer-section-label">Place / Activity</div>
            <div class="form-group">
              <label for="stop-place-input" class="form-label">Where do you want to go?</label>
              <input type="text" id="stop-place-input" class="form-input form-input-lg" list="stop-place-options"
                     placeholder="Type a place or activity (e.g. SM Baguio)" autocomplete="off" required>
              <datalist id="stop-place-options"></datalist>
              <span class="drawer-helper-text">Pick a known Baguio destination to auto-fill details, or type your own place.</span>
            </div>

            <!-- Selected Destination Preview Strip -->
            <div class="dest-preview-strip" id="stop-dest-preview-strip" style="display: none;">
              <img id="stop-preview-img" src="" alt="Destination photo" class="dest-preview-thumb">
              <div class="dest-preview-meta">
                <strong id="stop-preview-name">Destination Name</strong>
                <div class="dest-preview-tags">
                  <span class="badge" id="stop-preview-category">Category</span>
                  <span class="badge badge-fee" id="stop-preview-fee">Free</span>
                  <span class="preview-area-text" id="stop-preview-area">Area</span>
                </div>
              </div>
            </div>

            <div class="drawer-section-label">When</div>
            <!-- Day / Date pair -->
            <div class="form-row-2col">
              <div class="form-group">
                <label for="stop-day-select" class="form-label">Trip Day</label>
                <select id="stop-day-select" class="form-select">
                  <!-- Populated dynamically: Day 1, Day 2... -->
                </select>
              </div>
              <div class="form-group">
                <label for="stop-date-input" class="form-label">Start Date</label>
                <input type="date" id="stop-date-input" class="form-input" required>
              </div>
            </div>

            <!-- Start / End time pair -->
            <div class="form-row-2col">
              <div class="form-group">
                <label for="stop-time-input" class="form-label">Start Time</label>
                <input type="time" id="stop-time-input" class="form-input" value="09:00" required>
              </div>
              <div class="form-group">
                <label for="stop-end-time-input" class="form-label">End Time</label>
                <input type="time" id="stop-end-time-input" class="form-input" value="10:30">
              </div>
            </div>

            <div class="form-group">
              <label for="stop-duration-input" class="form-label">Duration (Minutes)</label>
              <div class="duration-input-wrap">
                <input type="number" id="stop-duration-input" class="form-input" value="90" min="15" max="480" step="15" required>
                <div class="duration-quick-chips">
                  <button type="button" class="duration-chip" data-dur="45">45m</button>
                  <button type="button" class="duration-chip" data-dur="60">1h</button>
                  <button type="button" class="duration-chip active" data-dur="90">1.5h</button>
                  <button type="button" class="duration-chip" data-dur="120">2h</button>
                </div>
              </div>
            </div>

            <div class="drawer-section-label">Details</div>
            <!-- Activity / Notes -->
            <div class="form-group">
              <label for="stop-activity-input" class="form-label">
                Planned Activity <span class="form-optional">(Optional)</span>
              </label>
              <input type="text" id="stop-activity-input" class="form-input" placeholder="e.g. Boating on Burnham Lake, photography, local food...">
              <div class="activity-suggestions-row" id="stop-activity-suggestions" style="display: none;">
                <span class="sugg-label">Suggested:</span>
                <div class="sugg-chips-wrap" id="stop-suggestions-chips"></div>
              </div>
            </div>

            <div class="form-group">
              <label for="stop-description-input" class="form-label">Description <span class="form-optional">(Optional)</span></label>
              <textarea id="stop-description-input" class="form-input" rows="2" placeholder="What to expect, tips, reminders..."></textarea>
            </div>

            <div class="form-row-2col">
              <div class="form-group">
                <label for="stop-website-input" class="form-label">Website <span class="form-optional">(Optional)</span></label>
                <input type="url" id="stop-website-input" class="form-input" placeholder="https://...">
              </div>
              <div class="form-group">
                <label for="stop-phone-input" class="form-label">Phone <span class="form-optional">(Optional)</span></label>
                <input type="tel" id="stop-phone-input" class="form-input" placeholder="Contact number">
              </div>
            </div>

            <div class="form-group">
              <label for="stop-address-input" class="form-label">Address / Plus Code <span class="form-optional">(Optional)</span></label>
              <input type="text" id="stop-address-input" class="form-input" placeholder="Street, landmark, or plus code">
            </div>

            <div class="form-group">
              <label for="stop-fee-input" class="form-label">Estimated Cost (&#8369;)</label>
              <input type="number" id="stop-fee-input" class="form-input" value="0" min="0" step="50" inputmode="decimal">
            </div>

            <!-- Budget Impact Alert in Drawer -->
            <div class="modal-budget-impact" id="stop-budget-impact">
              <span class="impact-fee-tag">Entrance Fee: <strong id="modal-impact-fee">&#8369;0</strong></span>
              <span class="impact-remaining-tag">Est. Remaining Budget: <strong id="modal-impact-remaining">&#8369;700</strong></span>
            </div>
          </div>

          <!-- Pinned drawer footer -->
          <div class="modal-actions-footer drawer-form-footer">
            <button type="button" class="btn btn-outline-danger drawer-remove-btn" id="btn-remove-stop" style="display: none;">Remove</button>
            <button type="button" class="btn btn-outline" id="btn-cancel-stop-modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save-stop">Add to Itinerary</button>
          </div>
        </form>
      </div>
    </div>
  </div>
